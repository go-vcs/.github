name: Renovate

on:
  schedule:
    # 20:44 UTC. The fleet staggers one organisation per hour, minutes
    # stepping 00/11/22/33/44, so no two runners ask the same token for its
    # five thousand requests an hour at once. 20:44 is the next unused slot in
    # the walk, the one after go-gitsafe at 19:44, and it is outside 05-10 UTC,
    # where about thirty runners already sit.
    - cron: '44 20 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v48.0.0
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
